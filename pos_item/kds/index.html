<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111c36" />
    <title>学園祭POS KDS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">FESTIVAL POS</p>
        <h1>キッチン表示</h1>
      </div>
      <div class="header-actions">
        <span id="connection-status" class="connection">接続確認中</span>
        <button id="demo-button" class="button secondary" type="button">デモ注文</button>
        <button id="login-button" class="button primary" type="button">Googleでログイン</button>
        <button id="logout-button" class="button secondary" type="button" hidden>ログアウト</button>
      </div>
    </header>

    <main>
      <section id="login-message" class="login-message panel">
        <h2>KDSへログイン</h2>
        <p>Googleログインすると、Firestoreに同期済みの売上をキッチン表示できます。</p>
      </section>

      <section id="kds-app" hidden>
        <div class="toolbar">
          <div id="summary" class="summary"></div>
          <div id="filters" class="filters" aria-label="表示する注文の状態"></div>
        </div>
        <p id="notice" class="notice" role="status"></p>
        <div id="orders" class="orders" aria-live="polite"></div>
      </section>
    </main>

    <template id="order-template">
      <article class="order-card">
        <header class="order-header">
          <div>
            <p class="order-number"></p>
            <p class="order-meta"></p>
          </div>
          <span class="state-badge"></span>
        </header>
        <div class="order-lines"></div>
        <footer class="order-actions"></footer>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>

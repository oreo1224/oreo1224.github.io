<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14213d" />
    <title>注文QR作成 | 学園祭POS</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <header class="topbar"><div><p class="eyebrow">FESTIVAL POS</p><h1>注文QRを作成</h1></div><p id="connection">商品を読み込み中</p></header>
    <main class="layout">
      <section class="panel product-panel"><div class="section-heading"><div><h2>商品を選択</h2><p>商品を選ぶと、トッピングの追加を確認します。</p></div></div><p id="notice" class="notice"></p><div id="product-grid" class="product-grid"></div></section>
      <aside class="panel cart-panel"><h2>注文内容</h2><div id="cart" class="cart"></div><p id="total" class="total">合計 ¥0</p><button id="generate-button" class="button primary" disabled>注文用QRコードを生成</button><button id="clear-button" class="button secondary" type="button">注文をクリア</button><section id="qr-panel" hidden><h2>このQRをレジで読み取ってください</h2><div id="qr-code" class="qr-code"></div><p id="qr-text" class="qr-text"></p></section></aside>
    </main>
    <div id="topping-modal" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">トッピングを追加しますか？</h2><p id="modal-base" class="modal-base"></p><div id="topping-grid" class="topping-grid"></div><p id="modal-total" class="modal-total"></p><div class="modal-actions"><button id="skip-topping" class="button secondary" type="button">追加せずカートへ</button><button id="add-with-topping" class="button primary" type="button">トッピングを追加</button></div></section></div>
    <script type="module" src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14213d" />
    <title>学園祭POS 管理画面</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">FESTIVAL POS</p>
        <h1>商品マスタ管理</h1>
      </div>
      <div class="account">
        <span id="account-name">ログインしていません</span>
        <button id="login-button" class="button primary">Googleでログイン</button>
        <button id="logout-button" class="button secondary" hidden>ログアウト</button>
      </div>
    </header>

    <main class="layout" hidden id="admin-app">
      <section class="card editor-card">
        <div class="section-heading">
          <div>
            <h2 id="editor-title">商品を登録</h2>
            <p>保存すると、次回の商品マスタ同期の対象になります。</p>
          </div>
        </div>
        <form id="product-form">
          <input id="product-id" type="hidden" />
          <label>
            商品名
            <input id="name" required maxlength="80" autocomplete="off" placeholder="例：焼きそば" />
          </label>
          <div class="two-columns">
            <label>
              販売価格（円）
              <input id="price-yen" required type="number" min="0" step="1" placeholder="500" />
            </label>
            <label>
              表示順
              <input id="sort-order" required type="number" step="1" value="0" />
            </label>
          </div>
          <label>
            注文QR用 商品コード（1〜9999、重複不可）
            <input id="order-code" required type="number" min="1" max="9999" step="1" placeholder="例：1" />
          </label>
          <label>
            カテゴリ
            <input id="category" maxlength="40" autocomplete="off" placeholder="例：フード" />
          </label>
          <label>
            商品ボタン色
            <select id="color-code">
              <option value="1">1：水色</option>
              <option value="2">2：緑</option>
              <option value="3">3：黄</option>
              <option value="4">4：オレンジ</option>
              <option value="5">5：紫</option>
              <option value="6">6：グレー</option>
              <option value="7">7：青緑</option>
              <option value="8">8：ピンク</option>
            </select>
          </label>
          <div class="toggles">
            <label><input id="active" type="checkbox" checked /> 販売対象</label>
            <label><input id="sold-out" type="checkbox" /> 売切</label>
            <label><input id="voucher-eligible" type="checkbox" checked /> 引換券利用可</label>
            <label><input id="topping-allowed" type="checkbox" /> トッピング選択可</label>
          </div>
          <div class="form-actions">
            <button class="button primary" type="submit">保存</button>
            <button id="reset-button" class="button secondary" type="button">入力をリセット</button>
          </div>
        </form>
      </section>

      <section class="card list-card">
        <div class="section-heading">
          <div>
            <h2>登録済み商品</h2>
            <p id="product-count">読み込み中…</p>
          </div>
          <input id="filter" type="search" placeholder="商品名・カテゴリで検索" />
        </div>
        <div class="csv-tools">
          <div>
            <h3>CSV一括登録</h3>
            <p><code>id,name,priceYen,category,sortOrder,orderCode,colorCode,active,soldOut,voucherEligible,toppingAllowed</code> の順で読み込みます。<code>id</code>が空なら新規登録、既存IDなら更新です。</p>
          </div>
          <div class="csv-actions">
            <button id="download-template-button" class="button secondary" type="button">CSV雛形をダウンロード</button>
            <button id="export-products-button" class="button secondary" type="button">登録済みをCSV出力</button>
            <label class="button primary file-button">CSVを選択<input id="csv-file" type="file" accept=".csv,text/csv" hidden /></label>
          </div>
        </div>
        <p id="notice" class="notice" role="status"></p>
        <div id="product-list" class="product-list"></div>
      </section>
    </main>

    <section id="login-message" class="login-message card">
      <h2>商品マスタ管理へログイン</h2>
      <p>指定されたGoogleアカウントだけが商品を編集できます。</p>
    </section>

    <template id="product-template">
      <article class="product-row">
        <div class="product-main">
          <h3 class="product-name"></h3>
          <p class="product-meta"></p>
          <div class="badges"></div>
        </div>
        <div class="product-actions">
          <button class="button secondary edit-button">編集</button>
          <button class="button danger delete-button">削除</button>
        </div>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>

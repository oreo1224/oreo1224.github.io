<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ポイントアップショップ検索</title><style>:root{--bg:#f6f7fb;--panel:#fff;--text:#17191f;--muted:#727784;--line:#e7e9ef;--shadow:0 8px 28px rgba(20,25,40,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Roboto,Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.93);backdrop-filter:blur(16px);border-bottom:1px solid rgba(220,223,232,.8)}.wrap{max-width:1120px;margin:auto;padding:18px}h1{font-size:clamp(23px,4vw,34px);margin:0;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px;margin:5px 0 14px}.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}.searchbox input{width:100%;border:0;outline:0;background:transparent;font-size:16px}.clear{border:0;background:#eef0f5;width:28px;height:28px;border-radius:50%;display:none}.filters{display:flex;gap:8px;overflow:auto;padding-top:12px}.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}.chip.active{background:#20232b;color:#fff}.resultbar{display:flex;justify-content:space-between;margin:20px 2px 12px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.shop{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}.shophead{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none}.brandtile{width:100%;height:100%;display:grid;place-items:center;font-size:11px;font-weight:950;color:#fff;text-align:center;padding:4px}.shopname{font-size:17px;font-weight:900}.category{font-size:11px;color:var(--muted)}.benefits{display:flex;flex-direction:column;gap:8px}.benefit{border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px}.cardrow{display:flex;align-items:center;gap:9px}.cardvisual{width:46px;height:29px;border-radius:5px;position:relative;flex:none}.cardvisual.smcc{background:linear-gradient(135deg,#0c4638,#59b98e)}.cardvisual.mufg{background:linear-gradient(135deg,#8d0d18,#d82d39)}.cardvisual.lawson{background:linear-gradient(135deg,#0a69b9,#77b9ec)}.cardvisual.saison{background:linear-gradient(135deg,#242933,#878f9e)}.mini{position:absolute;left:5px;top:4px;color:#fff;font-size:6px;font-weight:900;white-space:pre-line}.cardname{font-size:12px;font-weight:800;color:#555b66}.rate{font-size:20px;font-weight:950}.method,.note,.paybadges{grid-column:1/-1}.method{font-size:11px;color:#666d78}.note{font-size:10px;color:#9196a1}.paybadges{display:flex;gap:5px;flex-wrap:wrap}.paybadge{font-size:9px;font-weight:900;padding:3px 6px;border-radius:999px;background:#eef1f5}.paybadge.qp{background:#fff4d8;color:#8a5b00}.paybadge.touch{background:#eaf6f1;color:#14664c}.paybadge.mobile{background:#edf2ff;color:#3d57a3}.paybadge.online{background:#f3edff;color:#6446a8}.b-smcc{border-left:4px solid #148765}.b-mufg{border-left:4px solid #d3262e}.b-lawson{border-left:4px solid #1479d0}.b-saison{border-left:4px solid #2860b8}.notes{margin:24px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;font-size:12px;color:#686e7a;line-height:1.75}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h1>ポイントアップショップ</h1><div class="sub">店舗ごとに「どのカードで・どう払えば還元対象か」を確認</div><div class="searchbox">🔎<input id="q" type="search" placeholder="店舗名・カード名・支払方法・還元率で検索"><button class="clear" id="clear">×</button></div><div class="filters"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="smcc">三井住友NL</button><button class="chip" data-filter="mufg">三菱UFJ</button><button class="chip" data-filter="lawson">ローソンPonta+</button><button class="chip" data-filter="saison">セゾンパール</button></div></div></header><main><div class="wrap"><div class="resultbar"><span id="count"></span><span>2026/08/16 時点</span></div><div class="grid" id="grid"></div><div class="notes"><b>表示ルール</b><br>三井住友カード（NL）：対象店の店頭スマホタッチは7%。モバイルオーダー対象は別表示。<br>三菱UFJカード：対象店は基本7%。条件達成で最大20%の場合あり。<br>ローソンPontaプラス：2026年6月16日以降、対象店舗・サービスは基本5%、条件達成で最大15%。最大15%はアプリからエントリーが必要。<br>セゾンパールAMEX：国内QUICPay加盟店の店頭でApple Pay / Google Pay利用時に最大2%相当。年間利用合計30万円到達引落月まで。</div></div></main><script>const C={smccTouch:()=>({id:'smcc',card:'三井住友カード（NL）',rate:'7%',method:'スマホのVisa / Mastercardタッチ決済',note:'カード現物タッチ・iD・差し込み・磁気は対象外',cls:'b-smcc'}),smccBoth:()=>({id:'smcc',card:'三井住友カード（NL）',rate:'7%',method:'店頭スマホタッチ または 公式モバイルオーダー',note:'モバイルオーダーは対象チェーン公式経由のみ',cls:'b-smcc'}),smccStarbucks:()=>({id:'smcc',card:'三井住友カード（NL）',rate:'7%',method:'スターバックス公式アプリ / App Clip → Apple Pay',note:'スターバックスカードへのチャージは対象外',cls:'b-smcc'}),mufgStore:(n='')=>({id:'mufg',card:'三菱UFJカード',rate:'7%',method:'店頭クレジットカード / タッチ決済 / Apple Pay（QUICPay）',note:n||'条件達成で最大20%の場合あり',cls:'b-mufg'}),mufgMatsuya:()=>({id:'mufg',card:'三菱UFJカード',rate:'7%',method:'店舗券売機・セルフレジ：カード決済 / Apple Pay（QUICPay）',note:'対象取引に限定。条件達成で最大20%の場合あり',cls:'b-mufg'}),mufgPizza:()=>({id:'mufg',card:'三菱UFJカード',rate:'7%',method:'公式サイト / 公式アプリのオンラインカード決済',note:'対象オンライン注文',cls:'b-mufg'}),lawsonStore:()=>({id:'lawson',card:'ローソンPontaプラス',rate:'5〜15%',method:'差し込み / 磁気 / タッチ / Apple Pay（QUICPay）',note:'対象店5%。最大15%はアプリからエントリー＋条件達成',cls:'b-lawson'}),lawsonLawson:()=>({id:'lawson',card:'ローソンPontaプラス',rate:'1〜6%',method:'ローソンPontaプラスで店頭決済',note:'毎月10日・20日の6%は要エントリー',cls:'b-lawson'}),lawsonOnline:l=>({id:'lawson',card:'ローソンPontaプラス',rate:'5〜15%',method:l,note:'対象サービス5%。最大15%はエントリー＋条件達成',cls:'b-lawson'}),saison:()=>({id:'saison',card:'セゾンパールAMEX',rate:'最大2%',method:'店頭QUICPay → Apple Pay / Google Pay',note:'QUICPay加盟店のみ・年30万円到達引落月まで',cls:'b-saison'})};const S=C.saison,T=C.smccTouch,B=C.smccBoth,L=C.lawsonStore,M=C.mufgStore;const shops=[['ローソン','コンビニ',[C.lawsonLawson(),T(),M(),S()]],['ナチュラルローソン','コンビニ',[C.lawsonLawson(),T(),M(),S()]],['ローソンストア100','コンビニ',[C.lawsonLawson(),T(),M(),S()]],['セブン-イレブン','コンビニ',[T(),M(),S()]],['ミニストップ','コンビニ',[T(),S()]],['セイコーマート','コンビニ',[T(),S()]],['ポプラ','コンビニ',[T(),S()]],['マクドナルド','ファストフード',[B(),S()]],['モスバーガー','ファストフード',[B(),S()]],['ケンタッキーフライドチキン','ファストフード',[B(),S()]],['吉野家','牛丼',[B(),S()]],['すき家','牛丼',[B(),S()]],['スターバックス','カフェ',[C.smccStarbucks()]],['フレッシュネスバーガー','ファストフード',[T(),S()]],['サイゼリヤ','ファミレス',[T(),S()]],['ガスト','ファミレス',[T(),S()]],['バーミヤン','ファミレス',[T(),S()]],['しゃぶ葉','ファミレス',[T(),S()]],['ジョナサン','ファミレス',[T(),S()]],['夢庵','ファミレス',[T(),S()]],['はま寿司','寿司',[T(),S()]],['ココス','ファミレス',[T(),S()]],['ドトールコーヒーショップ','カフェ',[T(),S()]],['エクセルシオール カフェ','カフェ',[T(),S()]],['かっぱ寿司','寿司',[T(),S()]],['くら寿司','寿司',[L(),M('オンライン事前決済は対象外'),S()]],['スシロー','寿司',[L(),M('一部オンライン等は対象外'),S()]],['松屋','牛丼',[L(),C.mufgMatsuya(),S()]],['松のや','とんかつ',[L(),C.mufgMatsuya(),S()]],['マイカリー食堂','カレー',[L(),C.mufgMatsuya(),S()]],['ピザハットオンライン','ピザ',[C.lawsonOnline('公式サイト / 公式アプリのオンラインカード決済'),C.mufgPizza()]],['オーケー','スーパー',[L(),M(),S()]],['オオゼキ','スーパー',[M(),S()]],['東急ストア','スーパー',[M(),S()]],['東武ストア','スーパー',[M(),S()]],['肉のハナマサ','スーパー',[M(),S()]],['ジャパンミート','スーパー',[M(),S()]],['アカチャンホンポ','ベビー用品',[M(),S()]],['GARAKU','スープカレー',[L(),S()]],['つぼ八','居酒屋',[L(),S()]],['旬鮮酒場 天狗','居酒屋',[L(),S()]],['炭火串焼 テング酒場','居酒屋',[L(),S()]],['和食れすとらん 天狗','和食',[L(),S()]],['ロッテリア','ファストフード',[L(),S()]],['ゼッテリア','ファストフード',[L(),M(),S()]],['すし松','寿司',[L(),S()]],['ステーキ屋松','ステーキ',[L(),S()]],['松軒中華食堂','中華',[L(),S()]],['松太郎','ラーメン',[L(),S()]],['麦のトリコ','飲食店',[L(),S()]],['カラオケ館','カラオケ',[L(),S()]],['カラオケ歌屋','カラオケ',[L(),S()]],['スリラーカラオケ','カラオケ',[L(),S()]],['監獄カラオケ','カラオケ',[L(),S()]],['カラオケMash','カラオケ',[L(),S()]],['GEO','リユース・エンタメ',[L(),S()]],['GEO mobile','モバイルショップ',[L(),S()]],['2nd STREET','リユース',[L(),S()]],['メイクマン','ホームセンター',[L(),S()]],['コカ・コーラ自販機','自販機',[L()]],['ジハンピ対応自販機','自販機',[C.lawsonOnline('ジハンピにローソンPontaプラスを登録して決済')]],['北海道生まれ和食処とんでん','和食',[L(),S()]],['湯けむりの丘 つきさむ温泉','温浴施設',[L(),S()]],['TNOC THE STORE SAPPORO T4','ライフスタイル',[L(),S()]],['TNOC THE CAFE SAPPORO T4','カフェ',[L(),S()]],['山の猿','居酒屋',[L(),S()]],['徳寿','焼肉',[L(),S()]],['ミートキッチン log50','飲食店',[L(),S()]],['神田屋','居酒屋',[L(),S()]],['大衆食堂 てんぐ大ホール','居酒屋',[L(),S()]],['湊や磯吉食堂','居酒屋',[L(),S()]],['U-NEXT','動画配信',[C.lawsonOnline('U-NEXT月額料金のクレジットカード決済')]],['ジャルパック','旅行',[C.lawsonOnline('ジャルパック指定の対象オンラインカード決済')]]];const colors={'ローソン':'#1875c1','セブン-イレブン':'#e4572e','マクドナルド':'#d70000','モスバーガー':'#16834b','スターバックス':'#00754a','松屋':'#f7c600','スシロー':'#e21e2d','くら寿司':'#d71920','オーケー':'#d71920','GEO':'#3155a4','2nd STREET':'#65a744'};const norm=s=>(s||'').toLowerCase().replace(/\s+/g,'');let active='all',grid=document.getElementById('grid'),q=document.getElementById('q'),clear=document.getElementById('clear'),count=document.getElementById('count');function logo(n){return `<div class="logo"><div class="brandtile" style="background:${colors[n]||'#68707d'}">${n.slice(0,8)}</div></div>`}function badges(b){let a=[],m=b.method;if(/QUICPay/.test(m))a.push('<span class="paybadge qp">QUICPay</span>');if(/タッチ/.test(m))a.push('<span class="paybadge touch">タッチ</span>');if(/モバイルオーダー|App Clip/.test(m))a.push('<span class="paybadge mobile">モバイルオーダー</span>');if(/オンライン/.test(m))a.push('<span class="paybadge online">オンライン</span>');return `<div class="paybadges">${a.join('')}</div>`}function render(){let t=norm(q.value),f=shops.filter(([n,c,bs])=>(active==='all'||bs.some(b=>b.id===active))&&(!t||norm([n,c,...bs.flatMap(b=>[b.card,b.rate,b.method,b.note])].join(' ')).includes(t)));count.textContent=f.length+'件';grid.innerHTML=f.map(([n,c,bs])=>`<article class="shop"><div class="shophead">${logo(n)}<div><div class="shopname">${n}</div><div class="category">${c}</div></div></div><div class="benefits">${(active==='all'?bs:bs.filter(b=>b.id===active)).map(b=>`<div class="benefit ${b.cls}"><div class="cardrow"><div class="cardvisual ${b.id}"><span class="mini">${b.id==='smcc'?'SMBC\nNL':b.id==='mufg'?'MUFG':b.id==='lawson'?'Ponta+':'SAISON\nAMEX'}</span></div><div class="cardname">${b.card}</div></div><div class="rate">${b.rate}</div><div class="method">${b.method}</div>${badges(b)}<div class="note">${b.note}</div></div>`).join('')}</div></article>`).join('');clear.style.display=q.value?'block':'none'}q.oninput=render;clear.onclick=()=>{q.value='';render()};document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{document.querySelectorAll('.chip').forEach(y=>y.classList.remove('active'));x.classList.add('active');active=x.dataset.filter;render()});render();</script></body></html>

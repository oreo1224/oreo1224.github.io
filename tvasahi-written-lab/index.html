<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10172a"><title>テレ朝筆記 LAB | 2028卒</title><style>

</style></head><body><main><header><span class="logo">📺 TV ASAHI WRITTEN LAB</span><span class="sub">2028卒・非公式</span></header><section id="home"><h1>テレビ朝日<br>筆記試験対策 LAB</h1><p class="muted">就活体験談を参考にしたオリジナル予想問題。2026年11月版・全54問。実際の過去問や出題の保証ではありません。</p><div class="stats"><div><strong>54</strong><span class="sub">予想問題</span></div><div><strong>4</strong><span class="sub">分野</span></div><div><strong id="best">—</strong><span class="sub">直近の正答率</span></div></div><div class="panel"><h2>演習モード</h2><p class="sub">クイック演習は10問、全問演習は54問。模試は90分制限です。</p><div class="buttons"><button class="primary" onclick="begin('quick')">⚡ 10問演習</button><button onclick="begin('mock')">⏱ 90分模試</button><button onclick="begin('all')">📚 全54問</button><button onclick="begin('wrong')">🔁 間違い直し</button></div><label for="cat" class="sub">分野別演習</label><select id="cat"><option value="">分野を選択</option><option>2026時事</option><option>テレ朝・エンタメ</option><option>数学・一般常識</option><option>放送・IT技術</option></select><div class="buttons"><button onclick="begin('category')">選んだ分野を開始</button><button onclick="clearRecord()">履歴を消去</button></div></div><p class="sub">解答・復習履歴はブラウザのこの端末内に保存され、サーバーへ送信されません。時事の問題は自動更新されません。</p></section><section id="quiz" class="hidden"><div class="meta"><b id="count"></b><b id="timer"></b></div><progress id="bar" value="0" max="100"></progress><div class="panel"><div class="meta"><span id="category" class="tag"></span><span class="sub">四択・1問ずつ</span></div><h2 id="question"></h2><div id="options"></div><div class="buttons"><button onclick="previous()">前の問題</button><button class="primary" id="next" onclick="next()">次へ</button><button onclick="finish()">採点する</button></div></div></section><section id="result" class="hidden"><h1 id="score"></h1><p class="muted" id="summary"></p><div class="buttons"><button class="primary" onclick="home()">トップへ</button><button onclick="showReview(true)">間違いだけ表示</button><button onclick="showReview(false)">全問表示</button></div><div class="panel"><h2>解答と解説</h2><div id="reviews"></div></div></section></main><script>
const DATA=[["2026時事","2026年11月時点の日本の首相は？","石破茂|高市早苗|岸田文雄|菅義偉",1,"2026年11月時点の首相は高市早苗。"],["2026時事","2026年冬季五輪の開催地は？","札幌・長野|ミラノ・コルティナ|パリ・リヨン|ロサンゼルス",1,"イタリアのミラノ・コルティナ大会。"],["2026時事","2026年のサッカー男子W杯開催国は？","米国・カナダ・メキシコ|英国・フランス・ドイツ|日本・韓国・中国|スペイン・ポルトガル・モロッコ",0,"史上初の北米3か国共同開催。"],["2026時事","冬季オリンピックは原則何年ごと？","2年|3年|4年|5年",2,"夏季・冬季の各大会は原則4年ごと。"],["2026時事","日銀が政策運営で主に対象とする短期金利は？","無担保コール翌日物金利|住宅ローン固定金利|国債の表面利率|預金保険料率",0,"金融市場での翌日物金利が主要な操作対象。"],["2026時事","CPIが主に表すものは？","株価|家計が購入する財やサービスの価格|企業数|人口増減",1,"消費者物価指数を意味する。"],["2026時事","国連安保理の常任理事国は何か国？","4|5|6|7",1,"米・英・仏・中・ロの5か国。"],["2026時事","衆議院議員の任期は解散がなければ？","3年|4年|5年|6年",1,"原則4年。"],["2026時事","参議院議員の通常選挙は何年ごと？","2年|3年|4年|6年",1,"3年ごとに半数改選。"],["2026時事","生成AIがもっともらしい誤情報を作る現象は？","ハルシネーション|エンコード|レンダリング|サンプリング",0,"事実に反する内容を生成する現象。"],["2026時事","EUの一般データ保護規則の略称は？","GDPR|HDMI|WTO|NATO",0,"General Data Protection Regulation。"],["2026時事","パリ協定が採択された年は？","1997年|2010年|2015年|2022年",2,"2015年のCOP21で採択。"],["2026時事","GDPの日本語は？","国民総所得|国内総生産|消費者物価指数|経常収支",1,"国内で生み出された付加価値の合計。"],["2026時事","放送制作で『IP化』というと？","映像・音声のIPネットワーク伝送|映像のモノクロ化|周波数の倍増|レンズ交換",0,"IPネットワークを活用した制作・伝送。"],["2026時事","ネット上の情報を検証するときの基本は？","複数の一次情報を確認|SNSの拡散数だけを見る|見出しだけで断定|出典を無視",0,"報道や時事の対策では出典確認が不可欠。"],["テレ朝・エンタメ","『報道ステーション』の放送局は？","日本テレビ|TBS|テレビ朝日|テレビ東京",2,"テレビ朝日のニュース番組。"],["テレ朝・エンタメ","『ミュージックステーション』の通称は？","Mステ|音ステ|歌ステ|ミューQ",0,"長寿音楽番組。"],["テレ朝・エンタメ","『Qさま!!』を放送するのは？","フジテレビ|テレビ朝日|NHK Eテレ|テレビ東京",1,"テレ朝系列のクイズ番組。"],["テレ朝・エンタメ","『相棒』で水谷豊が演じる役は？","杉下右京|古畑任三郎|青島俊作|大門未知子",0,"主人公・杉下右京。"],["テレ朝・エンタメ","TELASAのサービス分類は？","映像配信|ラジオ放送|新聞印刷|衛星打上げ",0,"動画配信サービス。"],["テレ朝・エンタメ","テレビ朝日系列のニュースネットワークは？","JNN|FNN|ANN|TXN",2,"ANNはAll-Nippon News Network。"],["テレ朝・エンタメ","『徹子の部屋』の司会者は？","黒柳徹子|久米宏|草野仁|阿川佐和子",0,"長寿トーク番組。"],["テレ朝・エンタメ","『ドラえもん』のテレビアニメ放送局は？","テレビ朝日|TBS|日本テレビ|テレビ東京",0,"テレビ朝日系列。"],["テレ朝・エンタメ","テレビ東京系列の番組は？","Qさま!!|モヤモヤさまぁ〜ず2|相棒|報道ステーション",1,"局と番組の対応にも注目。"],["テレ朝・エンタメ","民放公式の見逃し配信サービスは？","TVer|e-Tax|J-STAGE|e-Gov",0,"TVerは民放公式の配信サービス。"],["テレ朝・エンタメ","テレビ朝日本社がある区は？","港区|渋谷区|新宿区|千代田区",0,"本社は六本木・港区。"],["テレ朝・エンタメ","緊急地震速報の目的は？","揺れの後に必ず出す|強い揺れの前に警戒を促す|地震を止める|震度を必ず正確に予言する",1,"地震波の到達時間差を利用。"],["数学・一般常識","800円の商品を25%引きで買うと？","550円|600円|625円|650円",1,"800×0.75＝600。"],["数学・一般常識","時速72kmは秒速何m？","10m|15m|20m|25m",2,"72000÷3600＝20。"],["数学・一般常識","3人で6時間の仕事を4人ですると？","3.5時間|4時間|4.5時間|5時間",2,"18人時÷4＝4.5。"],["数学・一般常識","サイコロで偶数が出る確率は？","1/6|1/3|1/2|2/3",2,"3通り÷6通り。"],["数学・一般常識","2x+7=19 のxは？","4|5|6|7",2,"2x=12。"],["数学・一般常識","視聴者10万人から12万人への増加率は？","12%|15%|20%|25%",2,"2÷10＝20%。"],["数学・一般常識","一辺5cmの正方形の対角線は？","5cm|5√2cm|10cm|25cm",1,"三平方の定理。"],["数学・一般常識","60kmを往路30km/h、復路60km/hで往復した平均速度は？","40km/h|45km/h|50km/h|55km/h",0,"120km÷3時間＝40km/h。"],["数学・一般常識","『遵守』の読みは？","そんしゅ|じゅんしゅ|じゅんじゅ|そんじゅ",1,"規則などを守ること。"],["数学・一般常識","『役不足』の本来の意味は？","能力に対して役目が軽すぎる|本人の能力が足りない|役が決まらない|仕事が多すぎる",0,"誤用が多い言葉。"],["数学・一般常識","『雨降って地固まる』の意味は？","争いの後に関係が安定|晴れの日が続く|用心深さが大切|失敗が続く",0,"揉め事の後によい状態になる。"],["数学・一般常識","日本の三権分立で司法権を担うのは？","内閣|国会|裁判所|日本銀行",2,"立法＝国会、行政＝内閣、司法＝裁判所。"],["数学・一般常識","『類推』に近い意味は？","似た事例から推し量る|事実を隠す|正反対に解釈する|採決する",0,"共通点から性質を推し量ること。"],["放送・IT技術","日本の地上デジタル放送方式は？","ISDB-T|DVB-S2|ATSC 3.0|NTSC",0,"日本の地上デジタル放送で採用。"],["放送・IT技術","映像60pのpは？","プログレッシブ走査|パケットロス|ピクセル比|パリティ",0,"順次走査。"],["放送・IT技術","1080iのiは？","インターレース|インターネット|インタラクティブ|インデックス",0,"飛び越し走査。"],["放送・IT技術","H.265の別名は？","AVC|HEVC|MPEG-2|AAC",1,"H.264はAVC。"],["放送・IT技術","UDPの特徴は？","必ず再送する|コネクションレスで低遅延用途に使われる|暗号化が必須|常にTCPより高品質",1,"UDP自体は配送や順序を保証しない。"],["放送・IT技術","IPv4のアドレス長は？","16ビット|32ビット|64ビット|128ビット",1,"IPv6は128ビット。"],["放送・IT技術","生中継の遅延を表す単位は？","ms|kg|lx|Hzのみ",0,"ミリ秒などで表す。"],["放送・IT技術","音声48kHzサンプリングとは？","毎秒48000回標本化|48kbit/s圧縮|48チャンネル|48dB",0,"1秒に48000標本。"],["放送・IT技術","SMPTE ST 2110が関連するのは？","映像・音声のIP伝送|新聞校正|字幕辞書|レンズ規格",0,"放送用プロメディアのIP伝送標準。"],["放送・IT技術","NTPの主な目的は？","機器間の時刻同期|映像の色変換|アンテナ調整|マイク集音",0,"Network Time Protocol。"],["放送・IT技術","4K UHDの一般的な画素数は？","1920×1080|2560×1440|3840×2160|7680×4320",2,"4K UHDは3840×2160。"],["放送・IT技術","ライブ配信のビットレートを下げる主な効果は？","必要帯域の削減|必ず画質向上|fpsが倍増|著作権処理不要",0,"必要帯域は減るが画質には注意。"],["放送・IT技術","輝度と色差を別々に表す方式は？","YCbCr|RGBのみ|ASCII|MIDI",0,"輝度成分と色差成分に分ける。"],["放送・IT技術","バックアップ回線の設計で重要なのは？","単一障害点を減らす|同じ回線に集中|監視停止|冗長機器を停止",0,"共通障害点を減らす。"]];const BANK=DATA.map(([cat,q,o,ans,why])=>({cat,q,opts:o.split("|"),ans,why}));let ids=[],answers=[],pos=0,deadline=0,ticker=null;const $=id=>document.getElementById(id),show=id=>{for(const x of ["home","quiz","result"])$(x).classList.toggle("hidden",x!==id)};function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function home(){clearInterval(ticker);show("home");const h=JSON.parse(localStorage.getItem("tvasahi-last")||"null");$("best").textContent=h?Math.round(h.correct/h.total*100)+"%":"—"}function clearRecord(){if(confirm("保存した成績と間違い履歴を消しますか？")){localStorage.removeItem("tvasahi-last");localStorage.removeItem("tvasahi-wrong");home()}}function begin(mode){let candidates=BANK.map((_,i)=>i);if(mode==="category"){let c=$("cat").value;if(!c){alert("分野を選んでね");return}candidates=candidates.filter(i=>BANK[i].cat===c)}if(mode==="wrong"){let wrong=JSON.parse(localStorage.getItem("tvasahi-wrong")||"[]");candidates=candidates.filter(i=>wrong.includes(i));if(!candidates.length){alert("復習対象はまだないよ。まず演習してね！");return}}ids=mode==="quick"?shuffle(candidates).slice(0,10):mode==="mock"?shuffle(candidates):shuffle(candidates);answers=ids.map(()=>null);pos=0;deadline=mode==="mock"?Date.now()+90*60000:0;clearInterval(ticker);if(deadline)ticker=setInterval(()=>{const ms=Math.max(0,deadline-Date.now());$("timer").textContent="残り "+Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0");if(ms===0)finish()},1000);else $("timer").textContent="時間制限なし";show("quiz");render()}function render(){const q=BANK[ids[pos]];$("count").textContent="Q"+(pos+1)+" / "+ids.length;$("bar").value=100*(pos+1)/ids.length;$("category").textContent=q.cat;$("question").textContent=q.q;$("options").replaceChildren();q.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="option"+(answers[pos]===i?" selected":"");b.textContent=String.fromCharCode(65+i)+". "+o;b.onclick=()=>{answers[pos]=i;render()};$("options").append(b)});$("next").textContent=pos===ids.length-1?"採点する":"次の問題 →"}function previous(){if(pos){pos--;render()}}function next(){if(pos===ids.length-1)finish();else{pos++;render()}}function finish(){clearInterval(ticker);if(!ids.length)return;const correct=ids.filter((id,i)=>BANK[id].ans===answers[i]).length;localStorage.setItem("tvasahi-last",JSON.stringify({correct,total:ids.length,at:new Date().toISOString()}));const old=new Set(JSON.parse(localStorage.getItem("tvasahi-wrong")||"[]"));ids.forEach((id,i)=>{if(answers[i]===BANK[id].ans)old.delete(id);else old.add(id)});localStorage.setItem("tvasahi-wrong",JSON.stringify([...old]));$("score").textContent=correct+" / "+ids.length+" 問正解";$("summary").textContent="正答率 "+Math.round(100*correct/ids.length)+"% ・ 未回答 "+answers.filter(a=>a===null).length+"問";show("result");showReview(false)}function showReview(wrongOnly){$("reviews").replaceChildren();let n=0;ids.forEach((id,i)=>{const q=BANK[id],ans=answers[i],ok=ans===q.ans;if(wrongOnly&&ok)return;n++;const d=document.createElement("div");d.className="review";const heading=document.createElement("b");heading.textContent=(ok?"✅ ":"❌ ")+"Q"+(i+1)+" "+q.q;d.append(heading);for(const line of ["あなたの回答: "+(ans===null?"未回答":q.opts[ans]),"正解: "+q.opts[q.ans],"解説: "+q.why]){let p=document.createElement("p");p.textContent=line;d.append(p)}$("reviews").append(d)});if(!n)$("reviews").textContent="全部正解！ 🎉"}home();
</script></body></html>
